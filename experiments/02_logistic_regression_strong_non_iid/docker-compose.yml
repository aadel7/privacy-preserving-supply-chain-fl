services:
  central-server:
    build:
      context: ./server
    ports:
      - "8080:8080"
    volumes:
      - .:/output
    environment:
      - METRICS_PATH=/output/metrics.json
      - EXPERIMENT_ID=02_logistic_regression_strong_non_iid
    networks:
      - fl-network

  client-1:
    build: .
    volumes:
      - ../../data/shipping_mode/client_1/data.csv:/app/data.csv
    environment:
      - SERVER_ADDRESS=central-server:8080
    depends_on:
      - central-server
    networks:
      - fl-network

  client-2:
    build: .
    volumes:
      - ../../data/shipping_mode/client_2/data.csv:/app/data.csv
    environment:
      - SERVER_ADDRESS=central-server:8080
    depends_on:
      - central-server
    networks:
      - fl-network

networks:
  fl-network:
    driver: bridge
