services:
  client-1:
    build: .
    volumes:
      - ../../data/shipping_mode/client_1/data.csv:/app/data.csv
      - .:/output
    environment:
      - CLIENT_ID=client_1_express
      - METRICS_PATH=/output/metrics_client_1.json
    networks:
      - fl-network

  client-2:
    build: .
    volumes:
      - ../../data/shipping_mode/client_2/data.csv:/app/data.csv
      - .:/output
    environment:
      - CLIENT_ID=client_2_standard
      - METRICS_PATH=/output/metrics_client_2.json
    networks:
      - fl-network

networks:
  fl-network:
    driver: bridge
